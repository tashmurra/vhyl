name: Library reference Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation builder
        run: python -m pip install -r requirements-docs.txt
      - name: Test reference extractor
        run: python -m unittest discover -s tests -p test_docs.py
      - name: Build and check reference
        run: python tools/build_docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference
        id: deployment
        uses: actions/deploy-pages@v4
